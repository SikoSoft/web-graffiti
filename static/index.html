<html>
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />

    <title>Web Graffiti</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" type="text/css" href="WebGraffiti.css" />
    <style>
      ss-icon {
        display: inline-block;
        width: 24px;
        height: 24px;
        vertical-align: middle;
        cursor: pointer;
      }
    </style>

    <script src="/ss-user-bundle.js"></script>

    <script type="importmap">
      {
        "imports": {
          "./lib/Client": "./lib/Client.js",
          "./lib/Config": "./lib/Config.js",
          "./lib/Editor": "./lib/Editor.js",
          "./lib/Input": "./lib/Input.js",
          "./lib/Loader": "./lib/Loader.js",
          "./lib/Menu": "./lib/Menu.js",
          "./lib/NetworkMonitor": "./lib/NetworkMonitor.js",
          "./lib/Render": "./lib/Render.js",
          "./lib/Socket": "./lib/Socket.js",
          "./lib/WebGraffiti": "./lib/WebGraffiti.js",
          "../spec/Config": "./spec/Config.js",
          "../spec/Canvas": "./spec/Canvas.js",
          "../spec/Client": "./spec/Client.js",
          "../spec/MessageSpec": "./spec/MessageSpec.js"
        }
      }
    </script>

    <script type="module">
      import { WebGraffiti } from "./lib/WebGraffiti.js";

      const userNode = document.createElement("div");
      userNode.className = "webGraffiti__menu_user";

      const wg = new WebGraffiti();
      window.wg = wg;
      document.onreadystatechange = async function () {
        if (document.readyState === "complete") {
          await wg.init(document.getElementById("webGraffiti"));

          userNode.appendChild(
            document.getElementById("user-template").content.cloneNode(true)
          );

          userNode.querySelector("ss-icon").addEventListener("click", (e) => {
            document.querySelector("user-portal").showLoginForm();
          });
          wg.menu.registerOption(userNode);
        }
      };

      window.addEventListener("user-logged-in", (e) => {
        const user = e.detail;
        userNode.querySelector(".name").textContent = user.username;
        wg.reconnect(e.detail.authToken);
      });
    </script>
  </head>

  <body>
    <div id="webGraffiti"></div>
    <user-portal></user-portal>
    <template id="user-template">
      <span class="name">Anonymous</span>
      <ss-icon class="profile" size="24" color="#fff"></ss-icon>
    </template>
  </body>
</html>
